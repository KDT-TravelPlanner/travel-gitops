name: Validate terraform

# infra/ 의 fmt + validate + test (mock provider, plan-only — AWS 자격증명 불필요).
on:
  pull_request:
    branches: [develop, main]
    paths: ["infra/**", "k8s/**", "monitoring/**", "scripts/eks/**", ".github/workflows/terraform-validate.yml"]
  push:
    branches:
      - "feat/SCRUM-*"
      - "fix/SCRUM-*"
      - "chore/SCRUM-*"
      - "ci/SCRUM-*"
      - "hotfix/SCRUM-*"
    paths: ["infra/**", "k8s/**", "monitoring/**", "scripts/eks/**", ".github/workflows/terraform-validate.yml"]

permissions:
  contents: read

concurrency:
  group: gitops-tf-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # mock_provider override_during 은 1.11+ 필요. 모놀리스와 동일 버전으로 고정.
          terraform_version: 1.15.8

      - name: fmt
        run: terraform -chdir=infra fmt -recursive -check -diff

      - name: validate + test
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-provider-cache
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in infra/modules/* infra/environments/*; do
            [ -f "$dir/terraform.tf" ] || continue
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -no-color
            terraform -chdir="$dir" validate -no-color
            if [ -d "$dir/tests" ]; then
              terraform -chdir="$dir" test -no-color
            fi
            echo "::endgroup::"
          done

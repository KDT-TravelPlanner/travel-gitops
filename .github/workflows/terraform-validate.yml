name: Validate terraform

# infra/ 의 fmt + validate + test (mock provider, plan-only — AWS 자격증명 불필요).
on:
  pull_request:
    branches: [develop, main]
    paths: ["infra/**", ".github/workflows/terraform-validate.yml"]
  push:
    branches:
      - "SCRUM-*"
      - "feat/SCRUM-*"
    paths: ["infra/**", ".github/workflows/terraform-validate.yml"]

permissions:
  contents: read

concurrency:
  group: gitops-tf-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: fmt
        run: terraform -chdir=infra fmt -recursive -check -diff

      - name: validate + test
        run: |
          set -euo pipefail
          for dir in infra/modules/* infra/environments/*; do
            [ -f "$dir/terraform.tf" ] || continue
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -no-color
            terraform -chdir="$dir" validate -no-color
            if [ -d "$dir/tests" ]; then
              terraform -chdir="$dir" test -no-color
            fi
            echo "::endgroup::"
          done

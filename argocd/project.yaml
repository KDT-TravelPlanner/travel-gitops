apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: travel-planner-kind-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: KDT Travel Diary MSA — Kind 개발 클러스터
  sourceRepos:
    - https://github.com/protove/travel-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: travel-planner
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
  # platform 은 Namespace, ingress-nginx 는 ClusterRole(Binding)/IngressClass/Webhook 을 만든다
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: networking.k8s.io
      kind: IngressClass
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

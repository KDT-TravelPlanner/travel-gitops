apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-dev-eks
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: travel-planner-dev-eks
  source:
    repoURL: https://github.com/KDT-TravelPlanner/travel-gitops.git
    targetRevision: main
    path: k8s/overlays/dev-eks/workload
  destination:
    server: https://kubernetes.default.svc
    namespace: travel-planner
  # 2026-09-14 첫 수동 sync와 API smoke(ALB 경유 200/401) 통과 후 활성화.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  # HPA(identity 1-4, 나머지 2-4)가 replicas를 소유한다. selfHeal이 HPA 결정을
  # 되돌리지 않도록 Deployment replicas 차이는 무시한다.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-dev-eks
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: travel-planner-dev-eks
  source:
    repoURL: https://github.com/KDT-TravelPlanner/travel-gitops.git
    targetRevision: develop
    path: k8s/overlays/dev-eks/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

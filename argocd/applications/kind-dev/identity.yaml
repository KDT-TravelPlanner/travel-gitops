apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: travel-planner-kind-dev
  source:
    repoURL: https://github.com/protove/travel-gitops.git
    targetRevision: develop
    # SCRUM-137: local kind load가 아니라 ECR digest를 실제로 pull해 검증한다.
    path: k8s/overlays/kind-ecr/backend/identity-service
  destination:
    server: https://kubernetes.default.svc
    namespace: travel-planner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# 문서 전용 — 실제 값은 넣지 않고, 레포에 실값 Secret 을 커밋하지 않는다.
#
# 실제 Secret 은 로컬에서 gitignore 된 env 파일로부터 생성한다:
#
#   kubectl create secret generic travel-planner-secret \
#     -n travel-planner \
#     --from-env-file=secrets/.env.kind-dev
#
# scripts/setup.sh 가 이 과정을 자동으로 한다 (재실행 시 최신 값으로 갱신).
#
# postgres / redis / 4개 서비스가 이 Secret 하나를 공유하며, 각 워크로드는
# 필요한 키만 secretKeyRef 로 개별 참조한다.
#
# 필수 키:
#   POSTGRES_DB          예) travel_diary_dev
#   POSTGRES_USER        예) travel_diary
#   POSTGRES_PASSWORD
#   REDIS_PASSWORD
#   JWT_SECRET           HS256 — 최소 32 bytes. 4개 서비스가 동일 값을 공유해야 토큰이 상호 통용된다.
#
# 선택 키 (로컬에서 비어 있어도 기동됨 — secretKeyRef.optional: true):
#   GOOGLE_MAPS_API_KEY          maps 외부 Google Places/Routes 호출용
#   GOOGLE_OAUTH_CLIENT_ID
#   GOOGLE_OAUTH_CLIENT_SECRET
#   NAVER_OAUTH_CLIENT_ID
#   NAVER_OAUTH_CLIENT_SECRET
apiVersion: v1
kind: Secret
metadata:
  name: travel-planner-secret
  namespace: travel-planner
type: Opaque
stringData:
  POSTGRES_DB: ""
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  REDIS_PASSWORD: ""
  JWT_SECRET: ""
  GOOGLE_MAPS_API_KEY: ""
  GOOGLE_OAUTH_CLIENT_ID: ""
  GOOGLE_OAUTH_CLIENT_SECRET: ""
  NAVER_OAUTH_CLIENT_ID: ""
  NAVER_OAUTH_CLIENT_SECRET: ""

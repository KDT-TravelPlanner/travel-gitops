apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travel-planner
resources:
- ../../../../base/backend/maps-service
- serviceaccount.yaml
- hpa.yaml
patches:
- path: deployment.patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: maps
configMapGenerator:
- name: maps-config
  literals:
  - SPRING_PROFILES_ACTIVE=prod
  - SERVER_PORT=8080
  - MANAGEMENT_SERVER_PORT=9091
  - LOGGING_FILE_NAME=/var/log/travel-planner/travel-planner.log
  - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres.dev-eks.kdt-travelplanner.internal:5432/travel_diary_dev?currentSchema=location
  - SPRING_DATA_REDIS_HOST=__ACTION_TIME_REDIS_PRIMARY_ENDPOINT__
  - SPRING_DATA_REDIS_PORT=6379
  - CORS_ALLOWED_ORIGINS=__ACTION_TIME_FRONTEND_ORIGIN__
  - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseG1GC
  - JWT_ISSUER=identity-service
  - SPRING_DATA_REDIS_USERNAME=default
  - SPRING_DATA_REDIS_SSL_ENABLED=true
- name: maps-alloy-config
  files:
  - config.alloy

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: travel-planner
resources:
- ../../../../base/backend/community-service
- serviceaccount.yaml
- hpa.yaml
patches:
- path: deployment.patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: community
configMapGenerator:
- name: community-config
  literals:
  - SPRING_PROFILES_ACTIVE=prod
  - SERVER_PORT=8080
  - MANAGEMENT_SERVER_PORT=9091
  - LOGGING_FILE_NAME=/var/log/travel-planner/travel-planner.log
  - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres.dev-eks.kdt-travelplanner.internal:5432/travel_diary_dev?currentSchema=community
  - IDENTITY_BASE_URL=http://identity:8080
  - TRAVEL_BASE_URL=http://travel:8080
  - CORS_ALLOWED_ORIGINS=https://kdt-travelplanner.protove.net
  - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseG1GC
  # db.t4g.micro RDS는 사용 가능한 연결이 약 80개다. 7 Pod x Hikari 기본 10 = 70이라
  # 새 Pod가 Flyway 초기화에서 53300(연결 슬롯 부족)으로 죽었다(2026-09-14).
  - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5
  - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
  - JWT_ISSUER=identity-service
- name: community-alloy-config
  files:
  - config.alloy

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kind 개발 환경의 수동 배포 진입점이다. Secret 5개는 scripts/setup.sh 가 생성한다.
# ingress-nginx 는 admission webhook 이 platform Ingress 보다 먼저 떠야 하므로 별도 적용한다.
#   kubectl apply -k k8s/overlays/kind-dev
resources:
  - platform
  - backend/identity-service
  - backend/community-service
  - backend/travel-service
  - backend/maps-service

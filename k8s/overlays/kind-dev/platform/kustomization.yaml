apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 환경 공용 플랫폼: base Namespace + Kind 전용 DB/Redis 스탠드인과 Ingress.
# Secret(postgres/redis/jwt/identity-oauth/maps) 은 여기 없다 — 레포에 실값을 커밋하지 않고
# scripts/setup.sh 가 secrets/*.dev.env 에서 생성한다 (secrets/README.md 참고).
resources:
  - ../../../base/platform
  - postgres.yaml
  - redis.yaml
  - ingress.yaml   # 단일 진입점 라우팅 (ingress-nginx 컨트롤러가 먼저 떠 있어야 admission 통과)

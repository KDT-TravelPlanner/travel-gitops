apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: travel-planner
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: travel-planner-kind-dev
  # app-of-apps: clusters/kind-dev/applications 아래의 Application 들을 관리한다.
  source:
    repoURL: https://github.com/protove/travel-gitops.git
    targetRevision: develop
    path: clusters/kind-dev/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: travel-planner

resources:
  - ../../base

# community 는 application.yml 에 flyway 스키마(community) + connection-init-sql +
# JWT_ISSUER 기본값(identity-service)이 박혀 있어 스키마/issuer env 가 없다. Redis 미사용.
configMapGenerator:
  - name: community-config
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8080
      - MANAGEMENT_SERVER_PORT=9091
      - LOGGING_FILE_NAME=/var/log/travel-planner/travel-planner.log
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/travel_diary_dev?currentSchema=community
      - IDENTITY_BASE_URL=http://identity:8080
      - TRAVEL_BASE_URL=http://travel:8080
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseG1GC

labels:
  - pairs:
      app.kubernetes.io/part-of: travel-planner
    includeSelectors: false

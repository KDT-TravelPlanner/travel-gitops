apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: travel-planner

resources:
  - ../../base

# 비민감 환경변수. 민감값(DB/Redis 비밀번호, JWT_SECRET, OAuth 키)은
# Secret(postgres/redis/jwt/identity-oauth)에서 Deployment 가 직접 참조한다.
configMapGenerator:
  - name: identity-config
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8080
      - MANAGEMENT_SERVER_PORT=9091
      # application-dev.yml 기본 로그 경로는 /app 기준 상대경로라 비루트(spring) 이미지에서
      # 못 쓴다. Dockerfile 이 spring 소유로 만들어둔 절대경로로 고정한다.
      - LOGGING_FILE_NAME=/var/log/identity-service/identity-service.log
      # 단일 DB + 서비스별 스키마. identity 는 application.yml 에 flyway/hibernate 스키마가
      # 박혀 있어 currentSchema 는 네이티브 쿼리 보조용.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/travel_diary_dev?currentSchema=identity
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - TRAVEL_SERVICE_BASE_URL=http://travel:8080
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      # 로컬 샌드박스에서는 S3 프로필 이미지 업로드를 끈다.
      - PROFILE_IMAGE_STORAGE_ENABLED=false
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70.0 -XX:+UseG1GC

labels:
  - pairs:
      app.kubernetes.io/part-of: travel-planner
    includeSelectors: false
